<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keystone</title>
  
    <link rel="preload" href="assets/SpaceGrotesk-VariableFont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="css/style.css" as="style">
    <link rel="preload" href="assets/wallpaper.jpg" as="image">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div> <!-- Toast Container -->  
    <input type="file" id="importFileInput" accept=".json" style="display: none;"> <!--hidden file input-->

    <div class="layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <i class="ph-fill ph-nut"></i>
                <a class="brand" href="https://github.com/snowlock-dev/keystone" target="_blank" rel="noopener noreferrer">
                    <span>Keystone</span> 
                </a>
                <span class="a-arrow">↗</span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" data-section="home"><i class="ph-fill ph-house"></i> <span>Home</span></a>
            <a href="#" class="nav-item" data-section="tasks"><i class="ph-fill ph-check-square-offset"></i> <span>Tasks</span></a>
            <a href="#" class="nav-item" data-section="tracker"><i class="ph-fill ph-timer"></i> <span>Tracker</span></a>
            <a href="#" class="nav-item" data-section="notes"><i class="ph-fill ph-notebook"></i> <span>Notes</span></a>
        </nav>

        <div class="sidebar-footer">
            <div class="footer-actions">
                <button class="footer-btn" id="exportBtn" title="Export JSON">
                    <i class="ph ph-file-arrow-up"></i>
                </button>
                
                <button class="footer-btn" id="importBtn" title="Import JSON">
                    <i class="ph ph-file-arrow-down"></i>
                </button>
            </div>

            <p><i class="ph ph-command"></i> Meta / Ctrl + 1/2/3/4</p>
        </div>
    </aside>


    <main class="main-area">
        <div class="app-container">

            <div class="section-view active" data-section="home">
                <header class="app-header">
                <div class="calendar-wrapper">
                    <div class="calendar-header">
                        <button class="nav-arrow" id="calPrev" aria-label="Previous month"><i class="ph ph-caret-left"></i></button>
                        <div class="calendar-month-year" id="calMonthYear"></div>
                        <button class="nav-arrow" id="calNext" aria-label="Next month"><i class="ph ph-caret-right"></i></button>
                    </div>
                </div>
                </header>

                <div class="calendar-wrapper">
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
            </div>

            <div class="section-view" data-section="tasks">
              <h1>Tasks</h1>
              <p>Task list will go here...</p>
            </div>

            <div class="section-view" data-section="tracker">
              <h1>Time Tracker</h1>
              <p>Stopwatch will go here...</p>
            </div>

            <div class="section-view" data-section="notes">
                <header class="app-header">
                    <h1>Quick Notes</h1>
                    <p>Jot down anything; saved automatically</p>
                </header>
            
                <div class="notes-wrapper">
                  <div class="notes-toolbar">
                    <span class="notes-save-indicator" id="notesSaveIndicator">All changes saved</span>
                    <div class="notes-toolbar-right">
                        <span class="notes-count" id="notesCount">0 words</span>
                        <button class="notes-clear-btn" id="notesClearBtn" title="Clear notes" aria-label="Clear all notes">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                </div>
                    <textarea id="notesInput" class="notes-input" placeholder="Start typing your notes here..." aria-label="Notes content"></textarea>
                </div>

            </div>

            </div>

        </div>
    </main>
    </div>

    <script src="js/app.js" defer></script>
</body>
</html>
