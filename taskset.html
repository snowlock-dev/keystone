<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSet</title>
    
    <!-- Importing JetBrains Mono Font -->
    <link rel="preconnect" href="https://actions.google.com">
    <link rel="preconnect" href="https://actions.google.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Theme - Flat, High Contrast */
            --bg-color: #050505;       
            --text-main: #ffffff;      
            --text-muted: #666666;     
            --accent: #3b82f6;         
            --accent-dim: #1e3a8a;     
            --border: #262626;         
            --danger: #ef4444;         
            --success: #22c55e;        
            
            --font-family: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /* --- Layout --- */
        .container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* --- Header --- */
        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        h1 {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 0;
            text-transform: uppercase;
        }

        /* --- Clock Section --- */
        .clock-section {
            margin-bottom: 60px;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s ease;
            z-index: 2;
        }

        .clock-section:hover .clock-display {
            color: var(--accent);
        }

        .clock-display {
            font-size: 5rem;
            font-weight: 700;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            margin-bottom: 10px;
            letter-spacing: -2px;
            line-height: 1;
            user-select: none;
            transition: color 0.3s ease, font-size 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .clock-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .clock-section:hover .clock-hint {
            opacity: 1;
        }

        /* --- Todo Input --- */
        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 1.1rem;
            flex: 1;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }

        .add-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px 15px;
            font-family: var(--font-family);
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .add-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* --- Todo List --- */
        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            border-bottom: 1px solid #111;
            transition: all 0.2s ease;
        }

        .todo-item:hover {
            background-color: #0a0a0a;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 4px;
        }

        /* Custom Checkbox */
        .checkbox-wrapper {
            position: relative;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .checkbox-wrapper input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: transparent;
            border: 2px solid var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .checkbox-wrapper input:checked ~ .checkmark {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-wrapper input:checked ~ .checkmark:after {
            display: block;
            left: 5px;
            top: 1px;
            width: 4px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .task-text {
            font-size: 1rem;
            color: var(--text-main);
            flex: 1;
            transition: color 0.3s ease;
        }

        .checkbox-wrapper input:checked ~ .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--font-family);
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .todo-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: var(--danger);
        }

        /* --- Zen Mode (Fullscreen) --- */
        body.zen-mode {
            overflow: hidden;
        }

        body.zen-mode .clock-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background: rgba(5, 5, 5, 0.2);
            z-index: 50;
            backdrop-filter: blur(0px);
        }

        body.zen-mode .clock-display {
            font-size: clamp(3rem, 12vw, 9rem);
            color: #ffffff !important; /* Explicit White */
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Ensure hover doesn't change color in Zen Mode */
        body.zen-mode .clock-display:hover {
            color: #ffffff !important;
        }

        body.zen-mode .clock-hint {
            display: none;
        }

        /* Blur everything behind the clock */
        body.zen-mode header,
        body.zen-mode .input-group,
        body.zen-mode .todo-list {
            filter: blur(8px);
            opacity: 0.6;
            pointer-events: none;
            user-select: none;
            transition: all 0.6s ease;
        }

        /* Utility for animation */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .clock-display { font-size: 3.5rem; }
            body.zen-mode .clock-display { 
                font-size: 18vw;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tasks</h1>
        </header>

        <!-- The Clock Section -->
        <section class="clock-section" id="clockSection">
            <div class="clock-display" id="clockDisplay">00:00:00</div>
            <div class="clock-hint">[ Click to enter Zen Mode ]</div>
        </section>

        <!-- Todo Input -->
        <div class="input-group" id="inputArea">
            <input type="text" id="taskInput" placeholder="Add a new task..." autocomplete="off">
            <button class="add-btn" id="addBtn">Add</button>
        </div>

        <!-- Todo List -->
        <ul class="todo-list" id="todoList">
            <!-- Items will be injected here -->
        </ul>
    </div>

    <script>
        // --- Clock Logic ---
        const clockDisplay = document.getElementById('clockDisplay');
        const clockSection = document.getElementById('clockSection');
        const inputArea = document.getElementById('inputArea');
        const todoList = document.getElementById('todoList');
        const header = document.querySelector('header');
        let isZenMode = false;

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            clockDisplay.textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // --- Zen Mode Logic ---
        function toggleZenMode() {
            isZenMode = !isZenMode;
            
            if (isZenMode) {
                document.body.classList.add('zen-mode');
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch((e) => {
                        console.log("Fullscreen request denied");
                    });
                }
            } else {
                document.body.classList.remove('zen-mode');
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen();
                }
            }
        }

        clockSection.addEventListener('click', toggleZenMode);

        // --- Todo List Logic ---
        const taskInput = document.getElementById('taskInput');
        const addBtn = document.getElementById('addBtn');

        let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];

        function saveTasks() {
            localStorage.setItem('myTasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            todoList.innerHTML = '';
            
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item fade-in';
                
                li.innerHTML = `
                    <label class="checkbox-wrapper">
                        <input type="checkbox" ${task.completed ? 'checked' : ''}>
                        <span class="checkmark"></span>
                    </label>
                    <span class="task-text">${escapeHtml(task.text)}</span>
                    <button class="delete-btn" data-index="${index}">DEL</button>
                `;

                const checkbox = li.querySelector('input[type="checkbox"]');
                checkbox.addEventListener('change', () => {
                    task.completed = checkbox.checked;
                    saveTasks();
                });

                const deleteBtn = li.querySelector('.delete-btn');
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    tasks.splice(index, 1);
                    saveTasks();
                    renderTasks();
                });

                todoList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text !== '') {
                tasks.push({
                    text: text,
                    completed: false
                });
                saveTasks();
                renderTasks();
                taskInput.value = '';
                taskInput.focus();
            }
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        addBtn.addEventListener('click', addTask);
        
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        renderTasks();

    </script>
</body>
</html>
